
<!DOCTYPE html>
<html>
<head>
    <title>Coin Flip</title>
</head>
<body>

    <h1>Heads or Tails?</h1>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRa_4SVje7PydfX3HWl8QX8d975lCDwvxRP1F-qPhdS2Q&s=10" id="coin"
         width="150" height="150">

    <br><br>

    <button id="flip">Flip!</button>

    <p>
        Heads Total: <span id="num_heads">0</span>
        <br>
        Tails Total: <span id="num_tails">0</span>
    </p>

    <script>

        var heads = 0;
        var tails = 0;

        document.getElementById("flip")
            .addEventListener("click", flipFunction);

        function flipFunction() {

            var number = Math.floor(Math.random() * 2);

            if (number == 0) {

                document.getElementById("coin").src =
                    "heads.jpg";

                heads++;
            }
            else {

                document.getElementById("coin").src =
                    "tails.jpg";

                tails++;
            }

            document.getElementById("num_heads").innerHTML =
                heads;

            document.getElementById("num_tails").innerHTML =
                tails;
        }

    </script>

</body>
</html>
